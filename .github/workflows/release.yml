name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag this push and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not X.Y.Z: $version"
            exit 1
          fi

          tag="v${version}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged="$(git rev-parse "${tag}^{commit}")"
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "Tag $tag already points at this commit"
              if ! gh release view "$tag" >/dev/null 2>&1; then
                gh release create "$tag" --verify-tag --generate-notes --title "$tag" --target "$GITHUB_SHA"
              fi
              exit 0
            fi
            echo "Tag $tag already exists on a different commit ($tagged)"
            exit 1
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag" --target "$GITHUB_SHA"
