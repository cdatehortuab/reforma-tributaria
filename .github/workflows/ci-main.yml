name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Align package.json with release/X.Y.Z
        id: version
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PRs into main must come from release/X.Y.Z (got $HEAD_REF)"
            exit 1
          fi

          expected="${HEAD_REF#release/}"
          echo "expected=${expected}" >> "$GITHUB_OUTPUT"

          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" = "$expected" ]; then
            echo "package.json already at $expected"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "Fork PR: package.json is $actual; branch $HEAD_REF requires $expected"
            exit 1
          fi

          EXPECTED="$expected" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.version = process.env.EXPECTED;
          writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          JS
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Checks
        uses: ./.github/actions/checks
        with:
          format-package-json: ${{ steps.version.outputs.bumped }}

      - name: Push the version bump to the release branch
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit --no-verify -m "Set version to ${{ steps.version.outputs.expected }}."
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          sha="$(git rev-parse HEAD)"
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name=ci \
            -f head_sha="$sha" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=CI' \
            -f 'output[summary]=Checks ran on this version bump in the same workflow.'
