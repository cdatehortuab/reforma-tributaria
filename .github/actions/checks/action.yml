name: Checks
description: Install dependencies, then typecheck, lint, test, and build.

inputs:
  format-package-json:
    description: Run Prettier on package.json after install (release version bump).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Format package.json after a version bump
      if: inputs.format-package-json == 'true'
      shell: bash
      run: pnpm exec prettier --write package.json

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Test
      shell: bash
      run: pnpm test

    - name: Build
      shell: bash
      run: pnpm build
